services:
  - type: web
    name: hujjat-aylanish-tizimi
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "12345678"
      - key: EMPLOYEE_PASSWORD
        value: "12345678"
      - key: SEED_DEMO
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: DB_PATH
        value: ./data/app.db
