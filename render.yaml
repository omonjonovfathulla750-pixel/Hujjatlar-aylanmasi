services:
  - type: web
    name: hujjat-aylanish-tizimi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "12345678"
      - key: EMPLOYEE_PASSWORD
        value: "12345678"
      - key: SEED_DEMO
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: DB_PATH
        value: ./data/app.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ARCHIVE_CHAT_ID
        sync: false
      - key: APP_URL
        sync: false
